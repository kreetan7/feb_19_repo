<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1>Pick a Color!</h1>
        <div class="color-options">
            <button class="color-btn" data-color="#FF6B6B">Red</button>
            <button class="color-btn" data-color="#4ECDC4">Teal</button>
            <button class="color-btn" data-color="#FFD93D">Yellow</button>
            <button class="color-btn" data-color="#1A535C">Blue</button>
        </div>
        <p class="color-code">Current Color: #FFFFFF</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
